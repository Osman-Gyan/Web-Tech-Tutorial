<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration Form</title>
</head>
<body>
    <h2>User Registration Form</h2>
    <form action="#" method="post">
        <label for="name">Name:</label><br>
        <input type="text" id="name" name="name" required><br>

        <label for="email">Email</label><br>
        <input type="email" id="email" name="emal" required><br>

        <label for="password">Password</label><br>
        <input type="password" id="password" name="password" minlength="8" required><br>

        <label>Gender</label><br>
        <input type="radio" id="male" name="gender" value="male">
        <label for="gender">Male</label>

        <input type="radio" id="femal" name="gender" value="female">
        <label for="gender">Female</label><br>

        <label>Interest</label><br>
        <input type="checkbox" id="sports" name="interests" value="sports">
        <label for="interests">Sports</label>

        <input type="checkbox" id="reading" name="interests" value="reading">
        <label for="interests">Reading</label>

        <input type="checkbox" id="videogames" name="interests" value="video games">
        <label for="interests">Video Games</label><br>

        <input type="submit" value="Submit"><br>

    </form>
    
</body>
</html>
